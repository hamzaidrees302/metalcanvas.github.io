<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetalCanvas | Modern Metal Art</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">MetalCanvas</div>
            <div class="cart-icon" onclick="toggleCart()">🛒 <span id="cart-count">0</span></div>
        </nav>
    </header>

    <main id="product-container">
        <!-- Products will be injected here by JavaScript -->
    </main>

    <div id="cart-modal" class="hidden">
        <div class="cart-content">
            <h2>Your Order</h2>
            <ul id="cart-items"></ul>
            <p>Total: Rs. <span id="total-price">0</span></p>
            <button class="btn-whatsapp" onclick="sendToWhatsApp()">Order via WhatsApp</button>
            <button onclick="toggleCart()">Close</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
