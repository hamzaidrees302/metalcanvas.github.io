<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout | MetalCanvas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container"><nav><div class="logo">MetalCanvas</div><a href="index.html" style="color:white; text-decoration:none;">Back to Shop</a></nav></div>
    </header>
    <div class="container">
        <div class="checkout-container">
            <h2>Your Invoice</h2>
            <div id="invoice-items" class="invoice-box"></div>
            
            <h3>Shipping Details</h3>
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="cust-name" placeholder="E.g. Hamza Idrees">
            </div>
            <div class="input-group">
                <label>Address</label>
                <input type="text" id="cust-addr" placeholder="House#, Street, City">
            </div>
            <div class="input-group">
                <label>Payment Method</label>
                <select id="pay-method">
                    <option value="EasyPaisa">EasyPaisa</option>
                    <option value="JazzCash">JazzCash</option>
                </select>
            </div>
            <button class="btn whatsapp-btn" onclick="sendOrder()">Send Order to WhatsApp</button>
        </div>
    </div>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
